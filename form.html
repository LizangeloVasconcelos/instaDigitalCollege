<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulario</title>

    <link rel="stylesheet" href="form.css">
    <link rel="stylesheet" href="reset.css">
</head>
<body>
    <div id="conteudo">
        <div id="navbar">
            <img src="logojetpack.png" height="40" alt="logojetpack">
            
            
            <div id="links">
                <a href="https:www.google.com" target="_blank">
                vamos para o google</a>
            </div>
        </div>
        <div id="sidebar">
            <form action="#" method="post">
                <div class="form-item">
                    <label for="texto-da-foto">Texto da foto</label>
                    <input type="text" name="texto-da-foto" id="nome">                                         
                </div>
            <form action="#" method="post">
                <div class="form-item">
                    <label for="selector">Marque se for verdadeiro</label>
                    <input type="checkbox" name="sletor" id="checkbox1">                                         
                </div>
            <div class="form-item">
                <label for="idade">Selcione sua idade</label>
                <input type="radio" name="idade" id="idade1">Menor de 18
                <input type="radio" name="idade" id="idade2">Entre 18 e 25
                <input type="radio" name="idade" id="idade3">Entre 25 e 40
                <input type="radio" name="idade" id="idade4">acima de 40
            </div>        
            <textarea name="descricao" id="des"></textarea>
            <input type="submit" value="enviar">
            </form>
        </div>
    </div>
</body>
</html>
